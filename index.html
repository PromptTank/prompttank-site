<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptTANK — Governance Infrastructure for the AI Era</title>
  <meta name="description" content="PromptTANK validates AI outputs in real time. Patent-pending deterministic governance infrastructure. Proof, not probability." />
  <meta property="og:title" content="PromptTANK — Governance Infrastructure for the AI Era" />
  <meta property="og:description" content="Every AI safety tool gives you a confidence score. PromptTANK gives you a receipt." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.theprompttank.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { background: #0B1530; color: #F0F2F7; overflow-x: hidden; font-family: 'Source Sans 3', sans-serif; }
    ::selection { background: rgba(0, 217, 166, 0.25); color: #F0F2F7; }
    a { text-decoration: none; }
    @media (max-width: 768px) {
      .desktop-nav { display: none !important; }
      .mobile-toggle { display: block !important; }
    }
    @media (min-width: 769px) {
      .mobile-menu { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Color System (Direction C: "Controlled Depth") ─────────────
    // Navy primary: #0B1530, #121E3D, #1B2559
    // Oceanic blue secondary: #2E6B9E, #4A90C4, #7AB8E0, #B8D9F0
    // Teal accent: #00D9A6, #00C896, #00F0B8
    // Warm white: #F0F2F7, #D4DAE7
    // Muted steel: #8E9DBF

    const SECTIONS = ["hero","problem","solution","why-now","credibility","team","vision","contact"];

    const mono = "'IBM Plex Mono', monospace";
    const sans = "'Source Sans 3', sans-serif";
    const serif = "'Source Serif 4', Georgia, serif";

    function useScrollSpy(ids) {
      const [active, setActive] = useState(ids[0]);
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            const visible = entries.filter(e => e.isIntersecting);
            if (visible.length > 0) setActive(visible[0].target.id);
          },
          { rootMargin: "-40% 0px -55% 0px" }
        );
        ids.forEach(id => { const el = document.getElementById(id); if (el) observer.observe(el); });
        return () => observer.disconnect();
      }, []);
      return active;
    }

    function useInView(threshold = 0.15) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.unobserve(el); } },
          { threshold }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return [ref, visible];
    }

    function FadeIn({ children, delay = 0, className = "" }) {
      const [ref, visible] = useInView();
      return (
        <div ref={ref} className={className} style={{
          opacity: visible ? 1 : 0,
          transform: visible ? "translateY(0)" : "translateY(24px)",
          transition: `opacity 0.7s ease ${delay}s, transform 0.7s ease ${delay}s`,
        }}>
          {children}
        </div>
      );
    }

    function LogoSVG({ size = 28 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="8" r="5" fill="#4A90C4" />
          <circle cx="10" cy="28" r="4" fill="#4A90C4" />
          <circle cx="30" cy="28" r="4" fill="#4A90C4" />
          <circle cx="20" cy="36" r="3" fill="#00D9A6" />
          <line x1="20" y1="13" x2="12" y2="24" stroke="#4A90C4" strokeWidth="1.5" />
          <line x1="20" y1="13" x2="28" y2="24" stroke="#4A90C4" strokeWidth="1.5" />
          <line x1="14" y1="28" x2="26" y2="28" stroke="#4A90C4" strokeWidth="1.5" />
          <line x1="20" y1="33" x2="20" y2="28" stroke="#00D9A6" strokeWidth="1.5" />
        </svg>
      );
    }

    function LogoText({ size = 18, color = "#F0F2F7" }) {
      return (
        <span style={{ fontFamily: sans, fontWeight: 600, fontSize: size, color, letterSpacing: "-0.02em" }}>
          Prompt<span style={{ color: "#4A90C4" }}>TANK</span>
        </span>
      );
    }

    // ─── NAV ────────────────────────────────────────────────────────
    function Nav() {
      const active = useScrollSpy(SECTIONS);
      const [scrolled, setScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const navItems = [
        { id: "problem", label: "Problem" },
        { id: "solution", label: "Solution" },
        { id: "why-now", label: "Why Now" },
        { id: "credibility", label: "Credibility" },
        { id: "team", label: "Team" },
        { id: "contact", label: "Contact" },
      ];

      return (
        <nav style={{
          position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
          background: scrolled ? "rgba(11,21,48,0.95)" : "transparent",
          backdropFilter: scrolled ? "blur(12px)" : "none",
          borderBottom: scrolled ? "1px solid rgba(42,63,110,0.3)" : "1px solid transparent",
          transition: "all 0.4s ease", padding: "0 24px",
        }}>
          <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
            <a href="#hero" style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <LogoSVG /><LogoText />
            </a>
            <div style={{ display: "flex", gap: 32, alignItems: "center" }} className="desktop-nav">
              {navItems.map(item => (
                <a key={item.id} href={`#${item.id}`} style={{
                  fontSize: 13, fontFamily: sans, fontWeight: 500,
                  color: active === item.id ? "#00D9A6" : "#B0BDDA",
                  letterSpacing: "0.04em", textTransform: "uppercase", transition: "color 0.3s",
                }}>{item.label}</a>
              ))}
            </div>
            <button className="mobile-toggle" onClick={() => setMobileOpen(!mobileOpen)}
              style={{ display: "none", background: "none", border: "none", color: "#F0F2F7", fontSize: 24, cursor: "pointer" }}>
              {mobileOpen ? "✕" : "☰"}
            </button>
          </div>
          {mobileOpen && (
            <div style={{ background: "rgba(11,21,48,0.98)", padding: "16px 24px", display: "flex", flexDirection: "column", gap: 16 }} className="mobile-menu">
              {navItems.map(item => (
                <a key={item.id} href={`#${item.id}`} onClick={() => setMobileOpen(false)} style={{
                  fontSize: 15, fontFamily: sans, fontWeight: 500,
                  color: active === item.id ? "#00D9A6" : "#B0BDDA",
                  letterSpacing: "0.04em", textTransform: "uppercase",
                }}>{item.label}</a>
              ))}
            </div>
          )}
        </nav>
      );
    }

    // ─── HERO ───────────────────────────────────────────────────────
    function Hero() {
      return (
        <section id="hero" style={{
          minHeight: "100vh",
          background: "linear-gradient(170deg, #0B1530 0%, #121E3D 40%, #162044 70%, #0D1A38 100%)",
          display: "flex", alignItems: "center", justifyContent: "center",
          position: "relative", overflow: "hidden", padding: "120px 24px 80px",
        }}>
          <div style={{
            position: "absolute", inset: 0, opacity: 0.04,
            backgroundImage: "linear-gradient(rgba(74,144,196,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(74,144,196,0.5) 1px, transparent 1px)",
            backgroundSize: "60px 60px",
          }} />
          <div style={{
            position: "absolute", top: "20%", left: "50%", transform: "translate(-50%, -50%)",
            width: 600, height: 600, borderRadius: "50%",
            background: "radial-gradient(circle, rgba(0,217,166,0.06) 0%, transparent 70%)",
          }} />
          <div style={{ maxWidth: 800, textAlign: "center", position: "relative", zIndex: 2 }}>
            <FadeIn>
              <div style={{
                display: "inline-block", padding: "6px 16px", borderRadius: 20,
                border: "1px solid rgba(0,217,166,0.3)", background: "rgba(0,217,166,0.08)", marginBottom: 28,
              }}>
                <span style={{ fontFamily: mono, fontSize: 12, color: "#00D9A6", letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 500 }}>
                  Patent-Pending · Peer-Reviewed
                </span>
              </div>
            </FadeIn>
            <FadeIn delay={0.1}>
              <h1 style={{
                fontFamily: serif, fontSize: "clamp(36px, 5.5vw, 64px)", fontWeight: 700,
                color: "#F0F2F7", lineHeight: 1.1, letterSpacing: "-0.03em", margin: "0 0 24px",
              }}>
                Governance Infrastructure<br />
                <span style={{ color: "#4A90C4" }}>for the AI Era</span>
              </h1>
            </FadeIn>
            <FadeIn delay={0.2}>
              <p style={{
                fontFamily: sans, fontSize: "clamp(17px, 2vw, 20px)", color: "#B0BDDA",
                lineHeight: 1.65, maxWidth: 620, margin: "0 auto 40px",
              }}>
                Every AI safety tool on the market gives you a confidence score — a statistical guess that the output is probably fine.
                You can't take a confidence score to a judge.
                <br /><br />
                <span style={{ color: "#D4DAE7" }}>PromptTank gives you a receipt.</span>
              </p>
            </FadeIn>
            <FadeIn delay={0.3}>
              <div style={{ display: "flex", gap: 16, justifyContent: "center", flexWrap: "wrap" }}>
                <a href="#contact" style={{
                  display: "inline-block", padding: "14px 32px", background: "#00D9A6", color: "#0B1530",
                  fontFamily: sans, fontWeight: 600, fontSize: 15, borderRadius: 6, letterSpacing: "-0.01em",
                  transition: "transform 0.2s, box-shadow 0.2s",
                }}
                  onMouseEnter={e => { e.target.style.transform = "translateY(-2px)"; e.target.style.boxShadow = "0 8px 30px rgba(0,217,166,0.25)"; }}
                  onMouseLeave={e => { e.target.style.transform = "translateY(0)"; e.target.style.boxShadow = "none"; }}
                >Get in Touch</a>
                <a href="#solution" style={{
                  display: "inline-block", padding: "14px 32px", background: "transparent", color: "#B0BDDA",
                  fontFamily: sans, fontWeight: 500, fontSize: 15, borderRadius: 6,
                  border: "1px solid rgba(136,150,179,0.3)", letterSpacing: "-0.01em", transition: "all 0.2s",
                }}
                  onMouseEnter={e => { e.target.style.color = "#F0F2F7"; e.target.style.borderColor = "rgba(136,150,179,0.6)"; }}
                  onMouseLeave={e => { e.target.style.color = "#B0BDDA"; e.target.style.borderColor = "rgba(136,150,179,0.3)"; }}
                >How It Works →</a>
              </div>
            </FadeIn>
          </div>
        </section>
      );
    }

    // ─── SECTION LABEL ──────────────────────────────────────────────
    function SectionLabel({ text }) {
      return <span style={{ fontFamily: mono, fontSize: 12, color: "#00D9A6", letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 500 }}>{text}</span>;
    }
    function SectionTitle({ children, maxWidth }) {
      return (
        <h2 style={{
          fontFamily: serif, fontSize: "clamp(28px, 4vw, 42px)", fontWeight: 700, color: "#F0F2F7",
          lineHeight: 1.15, letterSpacing: "-0.025em", margin: "16px 0 20px", maxWidth: maxWidth || "none",
        }}>{children}</h2>
      );
    }

    // ─── PROBLEM ────────────────────────────────────────────────────
    function Problem() {
      return (
        <section id="problem" style={{ background: "#0D1A38", padding: "100px 24px", position: "relative" }}>
          <div style={{ maxWidth: 900, margin: "0 auto" }}>
            <FadeIn>
              <SectionLabel text="The Problem" />
              <SectionTitle maxWidth={700}>
                AI is everywhere. <br />
                <span style={{ color: "#8E9DBF" }}>No one can prove it's working safely.</span>
              </SectionTitle>
            </FadeIn>
            <FadeIn delay={0.1}>
              <p style={{ fontFamily: sans, fontSize: 17, color: "#B0BDDA", lineHeight: 1.75, maxWidth: 680, marginBottom: 48 }}>
                When a staff member at a financial firm uses AI, the response often reaches the client before anyone has checked it. Fabricated regulation, wrong figures, hallucinated policy — that's the firm's legal exposure. And every safety tool on the market gives you a confidence score. A statistical guess. Probabilistic, not provable.
              </p>
            </FadeIn>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 20 }}>
              {[
                { stat: "$67B", label: "Global losses from AI hallucinations in 2024", source: "2025 Enterprise Study" },
                { stat: "3–20%", label: "Baseline hallucination rate in reasoning models, spiking in regulated fields", source: "2026 benchmarks" },
                { stat: "75%", label: "of enterprises lack AI governance infrastructure", source: "Gartner" },
              ].map((item, i) => (
                <FadeIn key={i} delay={0.15 + i * 0.1}>
                  <div style={{
                    background: "rgba(27,37,89,0.5)", border: "1px solid rgba(74,144,196,0.2)",
                    borderRadius: 8, padding: "28px 24px",
                    boxShadow: "0 4px 20px rgba(0,0,0,0.3), 0 0 0 1px rgba(74,144,196,0.08)",
                  }}>
                    <div style={{ fontFamily: mono, fontSize: 32, fontWeight: 700, color: "#00D9A6", marginBottom: 8 }}>{item.stat}</div>
                    <div style={{ fontFamily: sans, fontSize: 14, color: "#D4DAE7", lineHeight: 1.5, marginBottom: 8 }}>{item.label}</div>
                    <div style={{ fontFamily: mono, fontSize: 12, color: "#7A8FAD", letterSpacing: "0.02em", fontWeight: 500 }}>{item.source}</div>
                  </div>
                </FadeIn>
              ))}
            </div>
            <FadeIn delay={0.5}>
              <div style={{ marginTop: 48, borderTop: "1px solid rgba(74,144,196,0.1)", paddingTop: 40 }}>
                <span style={{ fontFamily: mono, fontSize: 11, color: "#7A8FAD", letterSpacing: "0.08em", textTransform: "uppercase" }}>
                  When AI gets it wrong
                </span>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 20, marginTop: 20 }}>
                  {[
                    { field: "Legal", text: "An attorney received a record $10,000 fine after 21 of 23 citations in a brief were fictitious. The AI invented them." },
                    { field: "Aviation", text: "Air Canada was held legally responsible for a bereavement policy its chatbot invented. The court rejected the defense that the AI was a separate entity." },
                    { field: "Finance", text: "Nearly 50% of enterprise AI users made at least one major decision based on hallucinated content in 2024." },
                  ].map((item, i) => (
                    <div key={i} style={{ padding: "20px 20px", borderLeft: "2px solid rgba(74,144,196,0.25)" }}>
                      <span style={{ fontFamily: mono, fontSize: 11, color: "#4A90C4", letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 600 }}>{item.field}</span>
                      <p style={{ fontFamily: sans, fontSize: 14, color: "#B0BDDA", lineHeight: 1.65, marginTop: 8 }}>{item.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </FadeIn>
          </div>
        </section>
      );
    }

    // ─── SOLUTION ───────────────────────────────────────────────────
    function Solution() {
      const caps = [
        { key: "VALIDATE", title: "Deterministic Output Testing", desc: "Every AI output is tested against configurable business rules, compliance constraints, and safety thresholds before it reaches users. Not probabilistic — deterministic. Pass or fail.", color: "#00D9A6" },
        { key: "AUDIT", title: "Full Decision Traceability", desc: "Every validation decision is logged with full context: what was tested, which rules applied, what passed, what failed, and why. A defensible audit trail built for regulators.", color: "#4A90C4" },
        { key: "GOVERN", title: "Policy Rule Configuration", desc: "Organizations define their own governance rules — compliance requirements, brand guidelines, safety thresholds — and the system enforces them automatically.", color: "#7AB8E0" },
      ];
      return (
        <section id="solution" style={{
          background: "linear-gradient(180deg, #0D1A38 0%, #0F1E40 50%, #0D1A38 100%)",
          padding: "100px 24px", position: "relative",
        }}>
          <div style={{ maxWidth: 900, margin: "0 auto" }}>
            <FadeIn>
              <SectionLabel text="The Solution" />
              <SectionTitle maxWidth={650}>Proof, not probability.</SectionTitle>
              <p style={{ fontFamily: sans, fontSize: 17, color: "#B0BDDA", lineHeight: 1.7, maxWidth: 640, marginBottom: 56 }}>
                PromptTank validates AI outputs in real time — before they reach users. Model-agnostic. Sub-second. Same input, same rules, same verdict. Every time.
              </p>
            </FadeIn>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 24 }}>
              {caps.map((cap, i) => (
                <FadeIn key={i} delay={0.1 + i * 0.12}>
                  <div style={{
                    background: "rgba(18,30,61,0.6)", border: "1px solid rgba(74,144,196,0.15)",
                    borderRadius: 8, padding: "32px 24px", position: "relative", overflow: "hidden",
                  }}>
                    <div style={{ position: "absolute", top: 0, left: 0, width: "100%", height: 2, background: `linear-gradient(90deg, ${cap.color}, transparent)` }} />
                    <span style={{ fontFamily: mono, fontSize: 12, color: cap.color, letterSpacing: "0.12em", fontWeight: 600 }}>{cap.key}</span>
                    <h3 style={{ fontFamily: serif, fontSize: 18, fontWeight: 600, color: "#F0F2F7", margin: "12px 0 10px", letterSpacing: "-0.01em" }}>{cap.title}</h3>
                    <p style={{ fontFamily: sans, fontSize: 14, color: "#B0BDDA", lineHeight: 1.65, margin: 0 }}>{cap.desc}</p>
                  </div>
                </FadeIn>
              ))}
            </div>
            <FadeIn delay={0.5}>
              <div style={{
                marginTop: 48, background: "rgba(18,30,61,0.4)",
                border: "1px solid rgba(74,144,196,0.1)", borderRadius: 8, padding: "28px 28px",
              }}>
                <div style={{ fontFamily: mono, fontSize: 11, color: "#7A8FAD", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 20 }}>
                  How It Works
                </div>
                <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
                  {[
                    { label: "AI generates response", icon: "→" },
                    { label: "PromptTank intercepts", icon: "→" },
                    { label: "Rule-based checks run in parallel", icon: "→" },
                    { label: "Verdict returned", icon: "" },
                  ].map((step, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <div style={{
                        background: i === 3 ? "rgba(0,217,166,0.12)" : "rgba(74,144,196,0.08)",
                        border: `1px solid ${i === 3 ? "rgba(0,217,166,0.25)" : "rgba(74,144,196,0.15)"}`,
                        borderRadius: 6, padding: "10px 16px",
                      }}>
                        <span style={{ fontFamily: sans, fontSize: 13, color: i === 3 ? "#00D9A6" : "#D4DAE7", fontWeight: 500 }}>{step.label}</span>
                      </div>
                      {step.icon && <span style={{ color: "#2E4A6E", fontSize: 16, fontFamily: mono }}>{step.icon}</span>}
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 16, marginTop: 20, flexWrap: "wrap", alignItems: "center" }}>
                  {[
                    { verdict: "PASS", color: "#00D9A6", bg: "rgba(0,217,166,0.1)" },
                    { verdict: "FLAG", color: "#E8B84A", bg: "rgba(232,184,74,0.1)" },
                    { verdict: "BLOCK", color: "#E85A5A", bg: "rgba(232,90,90,0.1)" },
                  ].map((v, i) => (
                    <div key={i} style={{ padding: "6px 14px", background: v.bg, borderRadius: 4, border: `1px solid ${v.color}33` }}>
                      <span style={{ fontFamily: mono, fontSize: 12, color: v.color, fontWeight: 600, letterSpacing: "0.06em" }}>{v.verdict}</span>
                    </div>
                  ))}
                  <span style={{ fontFamily: sans, fontSize: 13, color: "#8E9DBF" }}>— timestamped, locked, replayable under audit</span>
                </div>
              </div>
            </FadeIn>
          </div>
        </section>
      );
    }

    // ─── WHY NOW ────────────────────────────────────────────────────
    function WhyNow() {
      return (
        <section id="why-now" style={{
          background: "linear-gradient(180deg, #0D1A38 0%, #10203E 50%, #0D1A38 100%)", padding: "100px 24px",
        }}>
          <div style={{ maxWidth: 900, margin: "0 auto" }}>
            <FadeIn>
              <SectionLabel text="Why Now" />
              <SectionTitle>The deadline doesn't move.</SectionTitle>
            </FadeIn>
            <FadeIn delay={0.1}>
              <p style={{ fontFamily: sans, fontSize: 17, color: "#B0BDDA", lineHeight: 1.75, maxWidth: 660, marginBottom: 48 }}>
                The EU AI Act enforcement begins August 2, 2026. Three articles require exactly what PromptTank produces. The customer who needs this doesn't need to be convinced they have a problem. The law already did that.
              </p>
            </FadeIn>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 20, marginBottom: 48 }}>
              {[
                { article: "Article 9", title: "Risk Management", desc: "Continuous, iterative process to identify and mitigate risks across the AI lifecycle." },
                { article: "Article 14", title: "Human Oversight", desc: "High-risk systems must be designed so humans can effectively oversee them." },
                { article: "Article 52", title: "Transparency", desc: "Clear disclosure when users interact with AI. Synthetic content must be detectable." },
              ].map((a, i) => (
                <FadeIn key={i} delay={0.15 + i * 0.1}>
                  <div style={{ padding: 24, borderRadius: 8, background: "rgba(18,30,61,0.5)", border: "1px solid rgba(74,144,196,0.18)", boxShadow: "0 2px 16px rgba(0,0,0,0.25)" }}>
                    <span style={{ fontFamily: mono, fontSize: 11, color: "#4A90C4", letterSpacing: "0.08em", fontWeight: 600 }}>{a.article}</span>
                    <h3 style={{ fontFamily: serif, fontSize: 17, fontWeight: 600, color: "#F0F2F7", margin: "8px 0 6px", letterSpacing: "-0.01em" }}>{a.title}</h3>
                    <p style={{ fontFamily: sans, fontSize: 14, color: "#B0BDDA", lineHeight: 1.6, margin: 0 }}>{a.desc}</p>
                  </div>
                </FadeIn>
              ))}
            </div>
            <FadeIn delay={0.5}>
